
<VirtualHost 0.0.0.0:${VIRTUAL_PORT}>
        LogLevel info
        ServerName localhost
	ServerAlias ${VIRTUAL_HOST}
        ServerAdmin me@wintersections.de

        <Directory /opt/akte/static>
                Require all granted
        </Directory>
	    <Directory /opt/akte/akte>
        	<Files wsgi.py>
        	    Require all granted
            </Files>
        </Directory>
        <Directory /mnt/media>
            Require all granted
        </Directory>

        DocumentRoot /opt/akte/static
        DirectoryIndex index.html

        Alias /static /opt/akte/static
        Alias /media /mnt/media
        
        WSGIDaemonProcess akte user=www-data group=www-data  python-path=/opt/akte python-home=/usr/local/
    	WSGIProcessGroup akte
        WSGIApplicationGroup %{GLOBAL}
        WSGIScriptAliasMatch ^(/(api|admin)) /opt/akte/akte/wsgi.py$1
        WSGIPassAuthorization On

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
        
</VirtualHost>
