{% extends "base.html" %}

{% block content %}

{% if form.errors %}
<p style="color: var(--bs-danger); text-align: center">Benutzername und/oder Passwort falsch.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
{% csrf_token %}
    <div class="row mb-3 justify-content-center">
        <div class="col-auto">
            <label
                for="form-username"
                class="form-label"
                style="color: var(--bs-orange)"
            >Benutzername</label>
            <input
                class="form-control"
                id="form-username"
                name="username"
            />
        </div>
    </div>
    <div class="row mb-3 justify-content-center">
        <div class="col-auto">
            <label
                for="form-password"
                class="form-label"
                style="color: var(--bs-orange)"
            >Passwort</label>
            <input
                class="form-control"
                id="form-password"
                name="password"
                type="password"
            />
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-auto">
            <button class="btn btn-light" type="submit" value="login">Login</button>
        </div>
    </div>

    <input type="hidden" name="next" value="{{ next }}" />
</form>

{% endblock %}
