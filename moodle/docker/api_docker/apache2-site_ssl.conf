
<VirtualHost 0.0.0.0:${VIRTUAL_PORT}>
        LogLevel info
        ServerName localhost
	    ServerAlias ${VIRTUAL_HOST}
        ServerAdmin me@wintersections.de

        <Directory /opt/api/static>
                Require all granted
        </Directory>
	    <Directory /opt/api/api>
        	<Files wsgi.py>
        	    Require all granted
            </Files>
        </Directory>
        <Directory /mnt/media>
            Require all granted
        </Directory>

        DocumentRoot /opt/api/static
        DirectoryIndex index.html

        Alias /static /opt/api/static
        Alias /media /mnt/media
        
        WSGIDaemonProcess akte user=www-data group=www-data  python-path=/opt/api python-home=/usr/local/
    	WSGIProcessGroup akte
        WSGIApplicationGroup %{GLOBAL}
        WSGIScriptAliasMatch ^(/(api|admin)) /opt/api/api/wsgi.py$1
        WSGIPassAuthorization On

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLProxyEngine on
        SSLCertificateFile /usr/local/apache2/certs/server.crt
        SSLCertificateKeyFile /usr/local/apache2/certs/server.key
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLHonorCipherOrder on
        SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128:!AES256:!RSA
</VirtualHost>
