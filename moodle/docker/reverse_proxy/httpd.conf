ServerName localhost

LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
LoadModule proxy_html_module modules/mod_proxy_html.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so


SetOutputFilter INFLATE;proxy-html;DEFLATE
DeflateBufferSize 8192

RewriteEngine On
# Redirect /api/ requests to the API_HOST
RewriteCond %{REQUEST_URI} ^/api/
RewriteRule ^/api/(.*)$ http://%{ENV:API_HOST}/api/$1 [P]

# Redirect all other requests to the DEFAULT_HOST
#RewriteRule ^(.*)$ http://%{ENV:DEFAULT_HOST}/$1 [P]
RewriteRule ^(.*)$ http://moodle:8080/$1 [P]
ProxyPreserveHost On
ProxyPass / http://moodle:8080/
ProxyPassReverse / http://moodle:8080/

SSLEngine on
SSLProxyEngine on
SSLCertificateFile /usr/local/apache2/certs/server.crt
SSLCertificateKeyFile /usr/local/apache2/certs/server.key
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder on
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128:!AES256:!RSA